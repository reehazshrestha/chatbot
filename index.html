<!DOCTYPE html>
<!-- Apple UI Design System – Verified: 8pt Grid, SF Pro Typography, Material-Depth, Natural Spring Motion -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>BEN</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ben-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0a84ff"/>
        <stop offset="55%" stop-color="#6f5bff"/>
        <stop offset="100%" stop-color="#b055f7"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="app" id="app">

    <!-- ======================= Sidebar ======================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="1" y="1" width="22" height="22" rx="7" fill="url(#ben-grad)"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text></svg>
          </span>
          <span class="brand-name">BEN</span>
        </div>
        <div class="sidebar-top-actions">
          <button class="icon-btn new-chat-btn" id="newChatBtn" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn sidebar-close-btn" id="sidebarCloseBtn" title="Hide sidebar" aria-label="Hide sidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="searchChats" placeholder="Search chats" aria-label="Search chats" />
      </div>

      <nav class="chat-list" id="chatList" aria-label="Chat history"></nav>

      <div class="sidebar-footer">
        <button class="pill-btn" id="themeBtn" title="Toggle appearance" aria-label="Toggle appearance">
          <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span id="themeLabel">Light</span>
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- ======================= Main ======================= -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="chat-title" id="chatTitle" contenteditable="true" spellcheck="false" title="Rename chat"></h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="exportBtn" title="Export chat" aria-label="Export chat">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          </button>
          <button class="icon-btn danger" id="deleteBtn" title="Delete chat" aria-label="Delete chat">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40"><rect x="1" y="1" width="22" height="22" rx="7" fill="url(#ben-grad)"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text></svg>
          </div>
          <h2 class="welcome-title">Where should we begin?</h2>
          <p class="welcome-sub">Ask anything — history stays on this device.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>

      <!-- ======================= Composer ======================= -->
      <div class="composer-zone">
        <section class="reasoning-panel" id="reasoningPanel" hidden>
          <button class="reasoning-head" id="reasoningToggle" aria-expanded="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 3.6 10.8c-.6.5-.9 1-.9 1.7v.5h-5.4v-.5c0-.7-.3-1.2-.9-1.7A6 6 0 0 1 12 3z"/><path d="M10 19h4"/></svg>
            <span>Thinking</span>
            <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="reasoning-body" id="reasoningBody"></div>
        </section>

        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message BEN…" aria-label="Message"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button type="button" class="pill-btn toggle" id="imgBtn" role="switch" aria-checked="false" title="Toggle image generation">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="4"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
                <span>Image</span>
              </button>
              <button type="button" class="pill-btn model-pill" id="modelBtn" title="Choose model">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.6" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
                <span id="modelLabel">gemini-3.5-flash</span>
              </button>
              <button type="button" class="pill-btn model-pill size-pill" id="sizeBtn" hidden title="Image size & quality">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="M3 16l4.5-4.5 3 3 3.5-3.5L21 16"/></svg>
                <span id="sizeLabel">1024</span>
              </button>
              <button type="button" class="pill-btn toggle" id="thinkingBtn" role="switch" aria-checked="false" title="Toggle thinking mode">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 3.7 10.7c-.5.4-.7.9-.7 1.3H9c0-.4-.2-.9-.7-1.3A6 6 0 0 1 12 3z"/></svg>
                <span>Thinking</span>
              </button>
            </div>
            <div class="composer-right">
              <button type="submit" class="send-btn" id="sendBtn" title="Send" aria-label="Send message">
                <svg class="ico-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
                <svg class="ico-stop" viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- ======================= Model picker sheet ======================= -->
  <div class="overlay" id="modelOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Choose a model">
      <header class="sheet-head">
        <h3>Model</h3>
        <button class="icon-btn" id="modelCloseBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="modelList">
        <div class="skel"></div>
        <div class="skel"></div>
        <div class="skel"></div>
      </div>
    </div>
  </div>

  <!-- ======================= Image size sheet ======================= -->
  <div class="overlay" id="sizeOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Image size and quality">
      <header class="sheet-head">
        <h3>Image size</h3>
        <button class="icon-btn" id="sizeCloseBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body size-sheet-body">
        <div class="size-note">Larger sizes take longer to generate.</div>
        <div class="size-grid" id="sizeList"></div>
      </div>
    </div>
  </div>

  <!-- ======================= Confirm modal ======================= -->
  <div class="overlay" id="confirmOverlay" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p id="confirmMsg">This action cannot be undone.</p>
      <div class="dialog-actions">
        <button class="btn" id="confirmCancel">Cancel</button>
        <button class="btn danger-btn" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
